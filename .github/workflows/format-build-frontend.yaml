name: Frontend Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  # CI では cypress を実行しないためバイナリダウンロードをスキップする
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  build:
    name: 'Format & Build Frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Frontend
        run: pnpm format

      - name: Run i18next
        run: pnpm i18n:parse

      - name: Check for Changes After Format
        run: git diff --exit-code

      - name: Build Frontend
        env:
          # vite build は node 既定の 2GB ヒープでは OOM する
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: pnpm build

  test-frontend:
    name: 'Frontend Unit Tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test:frontend
