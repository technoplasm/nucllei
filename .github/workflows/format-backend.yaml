name: Python CI

on:
  # Docker Image (ghcr) が tag push 時に再利用呼び出しする(全 gate green → build)
  workflow_call:
  push:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  build:
    name: 'Format Backend'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyproject.toml の dev 依存と同じバージョンに固定
          pip install black==25.1.0

      - name: Format backend
        run: black . --exclude ".venv/|/venv/"

      - name: Check for changes after format
        run: git diff --exit-code
