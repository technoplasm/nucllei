name: Backend Tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  pytest:
    name: 'Backend pytest'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STT テストが音声形式判定に ffprobe を使う(本番 Docker イメージにも同梱)
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      # postgres 統合テストのコンテナは backend/open_webui/test/conftest.py が
      # docker で自前起動する(postgres:16.2 / port 8081)
      - name: Run pytest
        run: uv run pytest -q
