name: Backend Tests

on:
  # Docker Image (ghcr) が tag push 時に再利用呼び出しする(全 gate green → build)
  workflow_call:
  push:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'sandbox/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-backend.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'sandbox/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-backend.yaml'

# 連続 push で旧 run を打ち切る。group は literal 固定(lint-backend.yaml の注記参照)
concurrency:
  group: test-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: 'Backend pytest'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STT テストが音声形式判定に ffprobe を使う(本番 Docker イメージにも同梱)
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: License scan (strong copyleft)
        run: uv run python scripts/check_licenses.py

      # postgres 統合テストのコンテナは nucllei/test/conftest.py が
      # docker で自前起動する(postgres:16.2 / port 8081)
      - name: Run pytest
        run: uv run pytest -q

      # sandbox (image 側) のユニットテスト。`testpaths = ["nucllei/test"]` なので上の
      # pytest では収集されず、明示指定のこのタスクからしか走らない。
      # **別 job / 別 workflow を立てないのは課金単位のため** (lint-backend が black を
      # ruff と同居させたのと同じ理由 — 実働 0.2 秒に runner 1 分を割かない)。
      # 隔離テスト (sandbox/tests/test_isolation.py) は稼働中の privileged コンテナが要るので
      # CI では走らせない (手元・配備先で `uv run task sandbox-test`)。
      - name: Run sandbox unit tests
        run: uv run task sandbox-unit
