name: Lint Backend

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  ruff:
    name: 'Ruff (backend)'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # ruff 設定は pyproject.toml [tool.ruff](llens #25): select = E9,F。
      # 正しさ系(構文/未定義名/未使用 import 等)のみを gate 化し、整形は black が担う。
      - name: Lint backend
        run: uvx ruff==0.14.4 check backend/open_webui
