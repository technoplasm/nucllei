name: Lint Backend

on:
  # Docker Image (ghcr) が tag push 時に再利用呼び出しする(全 gate green → build)
  workflow_call:
  push:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint-backend.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'nucllei/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint-backend.yaml'

# 連続 push で旧 run を打ち切る。group は literal 固定 — reusable 呼び出し時の
# ${{ github.workflow }} は呼び出し元名になり、gate 同士が同一 group で相互キャンセルするため。
concurrency:
  group: lint-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Black + Ruff (backend)'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # 旧 Python CI(format-backend.yaml)を統合(2026-07-29): 実働 20 秒の black に
      # workflow 1 本 = 課金 1 分単位を割くのをやめ、ruff と同居させる。
      # バージョンは pyproject.toml の依存と一致させること(ずれると整形結果が食い違って
      # ここだけ落ちる — 実際 b95590df7 の 25.1.0 -> 26.3.1 でここが取り残された)。
      - name: Format check (black)
        run: uvx black==26.3.1 --check . --exclude ".venv/|/venv/"

      # ruff 設定は pyproject.toml [tool.ruff](llens #25): select = E9,F。
      # 正しさ系(構文/未定義名/未使用 import 等)のみを gate 化し、整形は black が担う。
      - name: Lint backend
        run: uvx ruff==0.14.4 check nucllei
