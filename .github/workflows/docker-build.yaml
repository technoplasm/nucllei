# tag push → ghcr へイメージを出す(refs #25)。git tag = image tag の 1:1 対応。
# tag 形式はリリース `vYYYYMMDD-NN` / プレ `pre-NN` の 2 形式のみ(0d69f2da4)。
# APP_VERSION に tag 名を焼き込む(BE/FE のバージョン真実源 — Dockerfile の ARG)。
# workflow_dispatch は配管テスト用(image tag `dev`、リリースには使わない)。
name: Docker Image (ghcr)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9]'
      - 'pre-[0-9][0-9]'

env:
  IMAGE: ghcr.io/technoplasm/nucllei

jobs:
  # 全 CI gate green でなければ image を出さない(master push 時と同じ 4 workflow を再利用呼び出し)
  format-backend:
    uses: ./.github/workflows/format-backend.yaml
  lint-backend:
    uses: ./.github/workflows/lint-backend.yaml
  test-backend:
    uses: ./.github/workflows/test-backend.yaml
  frontend:
    uses: ./.github/workflows/format-build-frontend.yaml

  build-and-push:
    needs: [format-backend, lint-backend, test-backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and image tags
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # tag が HEAD を指していることを確認(technoplasm-app と同じ検証)
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            echo "tag=$TAG head=$HEAD_COMMIT tag_commit=$TAG_COMMIT"
            [ "$HEAD_COMMIT" = "$TAG_COMMIT" ] || { echo "HEAD != tag commit"; exit 1; }

            echo "app_version=$TAG" >> "$GITHUB_OUTPUT"
            TAGS="$IMAGE:$TAG"
            # リリース tag(v*)のみ latest を更新。pre-NN は動かさない
            case "$TAG" in
              v*) TAGS="$TAGS,$IMAGE:latest" ;;
            esac
            echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
