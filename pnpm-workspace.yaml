# Allow native/build postinstall scripts for these deps (pnpm blocks them by
# default). Required so vite/esbuild native binaries build.
# 外した理由:
# - core-js: postinstall は寄付案内の表示のみ
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true

# The app imports several transitive packages directly (phantom deps that npm's
# flat node_modules used to hoist, e.g. @codemirror/*, lowlight,
# @floating-ui/utils). Hoist everything to the root so pnpm resolves them like npm.
shamefullyHoist: true

# 推移依存を修正版に揃える。いずれも親の宣言範囲内 (範囲外になるものは親を上げる)
# - dompurify (jspdf / mermaid, 親 ^3.x): GHSA-cg2g-xh64-v4q7 (>=3.4.4 <=3.4.16)
# - devalue (@sveltejs/kit / svelte, 親 ^5.8.1): GHSA-j22f-vq7h-c4qm / GHSA-mcm9-63f2-9j32 /
#   GHSA-x5rw-q4pp-hg5g / GHSA-r9w8-h9r3-54w4 ほか (<=5.9.2)
# - source-map-js (postcss ^1.2.1 / sass >=0.6.2 <2.0.0): GHSA-68fv-2mgg-jv7q (<1.2.2)
# 以下は dev 依存 (lint / i18n:parse) だけが使うもの
# - brace-expansion 1.x / 2.x (minimatch ^3 / ^9 / ^10 経由): GHSA-3jxr-9vmj-r5cp / GHSA-mh99-v99m-4gvg /
#   GHSA-rgw5-rvv9-x895 / GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 / GHSA-q2hr-2g5m-vwhr
# - js-yaml (@eslint/eslintrc, 親 ^4.1.0): GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh (<4.3.2)
# - undici (i18next-parser > cheerio, 親 ^7.19.0): GHSA-4cwx-7wf7-3272 ほか (<7.30.1)
# - postcss-selector-parser 6.1.x (eslint-plugin-svelte): GHSA-rj75-hqrm-r3gf (<6.1.5)
overrides:
  devalue: ^5.9.3
  dompurify: ^3.4.17
  source-map-js: ^1.2.2
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  js-yaml@4: ^4.3.2
  undici@7: ^7.30.1
  postcss-selector-parser@^6.1.0: ^6.1.5
