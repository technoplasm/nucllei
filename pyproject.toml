[project]
name = "nucllei"
description = "Nucllei"
authors = [
    { name = "Technoplasm, Inc." }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.7",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "python-multipart==0.0.20",
    # Required by starlette's SessionMiddleware; no longer pulled in transitively
    # since the starlette >=1.0 bump made it an optional dependency.
    "itsdangerous",

    "python-jose==3.4.0",
    "passlib[bcrypt]==1.7.4",

    "requests==2.32.3",
    "aiohttp==3.11.11",
    "async-timeout",
    "aiocache",
    "aiofiles",

    "sqlalchemy==2.0.38",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.9",
    "bcrypt==4.3.0",

    "boto3==1.35.53",

    "argon2-cffi==23.1.0",
    "APScheduler==3.10.4",


    "RestrictedPython==8.0",

    "loguru==0.7.2",
    "asgiref==3.8.1",

    # runtime 依存(dev ツールではない): tool/function エディタの整形端点
    # POST /utils/code/format が black.format_str を呼ぶ。CI の整形ゲートも同じピン。
    "black==25.1.0",

    "openai",
    "anthropic",
    "google-generativeai==0.8.4",
    "tiktoken",

    # llens(#52): langchain-core は tools.py の function-calling スキーマ変換で使用(CORE tool 基盤)。
    # langchain / langchain-community は文書抽出ローダ専用だったため撤去し、core だけ直接依存へ昇格。
    "langchain-core==0.3.86",

    "fake-useragent==2.1.0",

    # llens(#52): RAG ベクタ DB(chromadb/pymilvus/qdrant/opensearch/elasticsearch)は
    # RAG 撤去で全滅・撤去。ただし chromadb は (1) OTEL instrumentor が同梱ヘルパ経由で使い、
    # (2) typer(CLI)・opentelemetry stack・websocket-client(comfyui 画像生成)を推移的に
    # 供給していたため、それらを直接依存へ昇格し、instrumentors.py を素の FastAPIInstrumentor
    # 直呼びに置換して chromadb ごと撤去。
    "typer==0.15.1",
    "websocket-client==1.8.0",
    "opentelemetry-api==1.31.1",
    "opentelemetry-sdk==1.31.1",
    "opentelemetry-exporter-otlp==1.31.1",
    "opentelemetry-instrumentation==0.52b1",
    "opentelemetry-instrumentation-fastapi==0.52b1",
    "opentelemetry-instrumentation-sqlalchemy==0.52b1",
    "opentelemetry-instrumentation-requests==0.52b1",
    "opentelemetry-instrumentation-logging==0.52b1",
    "opentelemetry-instrumentation-httpx==0.52b1",
    "opentelemetry-instrumentation-aiohttp-client==0.52b1",

    # llens(#52): 文書抽出は fork にコードを持たない。prism の Attachment Function が markitdown を
    # 直接 import して md 化する(docling ではない素の抽出・OCR なし)。fork は markitdown を同梱する
    # だけ(air-gapped イメージに実体を載せる)。xlsx→シート別 CSV 等の型別ポリシーは prism が手前で処理。
    # extra は絞らない([all])。langchain ローダ群(unstructured/networkx/docx2txt/pypdf/ftfy/nltk)は撤去。
    "markitdown[all]",
    # 配備層 Function 向けの PDF ラスタライズ(llens pdf_vision 等)。pip のみで完結し
    # poppler 等の system deps を要らない pdfium バインディング。markitdown と同じ
    # 「同梱するだけ・fork は画像化コードを持たない」の位置づけ。
    "pypdfium2==4.30.1",
    "fpdf2==2.8.2",
    "pymdown-extensions==10.14.2",
    "python-pptx==1.0.0",
    "Markdown==3.7",
    "pypandoc==1.15",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "pyxlsb==1.0.10",
    "xlrd==2.0.1",
    "psutil",
    "sentencepiece",
    "soundfile==0.13.1",
    "azure-ai-documentintelligence==1.0.0",

    "pillow==11.1.0",
    "opencv-python-headless==4.11.0.86",

    "onnxruntime==1.20.1",

    "PyJWT[crypto]==2.10.1",
    "authlib==1.4.1",

    "langfuse==2.44.0",
    "youtube-transcript-api==1.0.3",
    "pytube==15.0.0",

    # extract_msg は GPL 依存連鎖(extract-msg→RTFDE→oletools→pcodedmp[GPLv3])のため除外。
    # 用途は .msg(Outlook)アップロードのみ(_memos/license-audit.md、issue #2)
    "pydub",

    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",

    "googleapis-common-protos==1.63.2",
    "google-cloud-storage==2.19.0",

    "azure-identity==1.20.0",
    "azure-storage-blob==12.24.1",

    "ldap3==2.9.1",


    "tencentcloud-sdk-python==3.0.1336",

]
readme = "README.md"
requires-python = ">=3.11,<3.14"
# 配布用メタデータではない(Docker のみで出荷・wheel/PyPI 配布はしない — #34)。
# バージョンの真実源は git tag(APP_VERSION、#25)。ここは uv が要求するので置くだけ。
version = "0.0.0"

[project.optional-dependencies]
# 内蔵 STT(faster-whisper)。torch を引かないので軽く、Docker イメージに同梱する
# (#53: prod は内蔵 faster-whisper STT)。
stt = [
    "faster-whisper==1.1.1",
]
# On-device ML stack (pulls in torch, ~GBs). Only needed for LOCAL inference:
# the transformers audio pipeline, local Whisper STT, and OCR. Not required to
# boot the app or to use external providers (external STT). Install with:
#   uv sync --extra local-ml
# llens(#52): RAG embeddings / reranking (sentence-transformers / colbert-ai /
# einops) removed with the RAG/knowledge stack — no longer part of this fork.
local-ml = [
    "transformers",
    "accelerate",
    "faster-whisper==1.1.1",
    "rapidocr-onnxruntime==1.3.24",
]

[dependency-groups]
dev = [
    "playwright==1.49.1",
    "ruff==0.14.4",
    "docker~=7.1.0",
    "pytest~=8.3.2",
    "pytest-docker~=3.1.1",
    "moto[s3]>=5.0.26",
    "gcp-storage-emulator>=2024.8.3",
    "taskipy>=1.14.1",
]

[tool.ruff]
# llens(#25): lint は「正しさ系のみ・green 維持」。整形は black が担う。
# マイグレーション(alembic)は自動生成主体 — lint しない。
extend-exclude = [
    "nucllei/migrations",
]
# pre-push hook のようにファイルを明示指定で渡す呼び出しでも exclude を尊重する
# (既定ではディレクトリ走査時しか効かず、#34 の全ファイルリネームで hook が migration に噛んだ)
force-exclude = true

[tool.ruff.lint]
# E9 = 構文/実行時エラー級、F = pyflakes(未定義名・未使用 import 等)
select = ["E9", "F"]

[tool.uv]
# Treat this as a virtual project: `uv sync` installs dependencies into .venv
# but does NOT build/install nucllei itself.
# Run the backend from the repo root with `uv run task dev`.
package = false

[tool.pytest.ini_options]
# テストは `from test.util ...` / `from nucllei ...` の両方を import するため、
# リポジトリルート(nucllei パッケージ)と nucllei/(test パッケージ)を
# sys.path に載せる。リポジトリルートから `uv run pytest` で実行する。
testpaths = ["nucllei/test"]
pythonpath = [".", "nucllei"]

[tool.taskipy.tasks]
# Backend dev server (hot reload) on :3000 — matches the docker single-origin
# layout (the frontend is served same-origin and Vite proxies /api etc. here;
# see vite.config.ts). `nucllei` はリポジトリルート直下なので cwd から import できる。
# `--forwarded-allow-ips '*'` trusts the local Vite proxy for X-Forwarded-*.
dev = "uvicorn nucllei.main:app --host 0.0.0.0 --port 3000 --reload --forwarded-allow-ips '*'"
# 依存ライセンス一覧(static/licenses.json)の再生成 — 依存を増減したら回して結果をコミット
licenses = "python scripts/generate_licenses.py"
# deploy の入口(technoplasm-app `make tag` の移植): ガード → 採番 → tag → push(既定)
# → CI が ghcr.io/technoplasm/nucllei:<tag> を出す。`uv run task tag pre` / `tag release`。
tag = "python scripts/tag.py"

# nucllei CLI(typer app: `nucllei:app`)への汎用エントリ。任意のサブコマンドを
# 後ろに足して叩ける。コンソールスクリプトは未インストール(package=false)なので
# typer app を直接呼ぶ。Docker の CMD も同じ入口(serve)を使う。
#   uv run task cli --help
#   uv run task cli create-admin --email a@llens.local --name A --password llens-dev
#   uv run task cli generate-secret-key
cli = "python -c 'from nucllei import app; app()'"
# 慣例の dev admin(ken@llens.local / llens-dev)を一発で作る cli の薄いエイリアス。
create-admin = "python -c 'from nucllei import app; app()' create-admin --email ken@llens.local --name Ken --password llens-dev"

