[project]
name = "nucllei"
description = "Nucllei"
authors = [
    { name = "Technoplasm, Inc." }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.7",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "python-multipart==0.0.30",
    # Required by starlette's SessionMiddleware; no longer pulled in transitively
    # since the starlette >=1.0 bump made it an optional dependency.
    "itsdangerous",

    "passlib[bcrypt]==1.7.4",

    "requests==2.32.3",
    "aiohttp==3.14.3",
    # llens(#97): これまで openai/anthropic 経由の transitive 依存だったが、CORE の請求経路
    # (/ext プロキシ・context_images の inline 解決)と subagent.py が直接 import するため直接依存へ昇格。
    # ピンしないのは SDK 側の httpx 制約と衝突させないため(aiofiles 等と同方針)。
    "httpx",
    "aiocache",
    "aiofiles",

    "sqlalchemy==2.0.38",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.9",
    "bcrypt==4.3.0",

    "boto3==1.35.53",

    "loguru==0.7.2",
    "asgiref==3.8.1",

    # runtime 依存(dev ツールではない): tool/function エディタの整形端点
    # POST /utils/code/format が black.format_str を呼ぶ。CI の整形ゲートも同じピン。
    "black==26.3.1",

    "openai",
    "google-generativeai==0.8.4",
    "tiktoken",

    # llens(#52): langchain-core は tools.py の function-calling スキーマ変換で使用(CORE tool 基盤)。
    # langchain / langchain-community は文書抽出ローダ専用だったため撤去し、core だけ直接依存へ昇格。
    "langchain-core==1.5.3",

    # llens(#52): RAG ベクタ DB(chromadb/pymilvus/qdrant/opensearch/elasticsearch)は
    # RAG 撤去で全滅・撤去。ただし chromadb は (1) OTEL instrumentor が同梱ヘルパ経由で使い、
    # (2) typer(CLI)・opentelemetry stack・websocket-client(comfyui 画像生成)を推移的に
    # 供給していたため、それらを直接依存へ昇格し、instrumentors.py を素の FastAPIInstrumentor
    # 直呼びに置換して chromadb ごと撤去。
    "typer==0.15.1",
    "opentelemetry-api==1.31.1",
    "opentelemetry-sdk==1.31.1",
    "opentelemetry-exporter-otlp==1.31.1",
    "opentelemetry-instrumentation==0.52b1",
    "opentelemetry-instrumentation-fastapi==0.52b1",
    "opentelemetry-instrumentation-sqlalchemy==0.52b1",
    "opentelemetry-instrumentation-requests==0.52b1",
    "opentelemetry-instrumentation-logging==0.52b1",
    "opentelemetry-instrumentation-httpx==0.52b1",
    "opentelemetry-instrumentation-aiohttp-client==0.52b1",

    # llens(#52): 文書抽出は fork にコードを持たない。prism の Attachment Function が markitdown を
    # 直接 import して md 化する(docling ではない素の抽出・OCR なし)。fork は markitdown を同梱する
    # だけ(air-gapped イメージに実体を載せる)。xlsx→シート別 CSV 等の型別ポリシーは prism が手前で処理。
    # extra は file-format 系に絞る(2026-07-18 改訂: 0.1.x の [all] は azure 系の
    # プレリリース依存を引いて解決不能。旧 0.0.2 に固定されていた原因も [all])。
    # magika(0.1.x のコア依存)が py3.13 で numpy>=2.1 を要求し local-ml の rapidocr と
    # 衝突するため requires-python は <3.13(docker=3.11 / dev=3.12 で実害なし)。
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook,epub]>=0.1.6",
    # 配備層 Function 向けの PDF ラスタライズ(llens pdf_vision 等)。pip のみで完結し
    # poppler 等の system deps を要らない pdfium バインディング。markitdown と同じ
    # 「同梱するだけ・fork は画像化コードを持たない」の位置づけ。
    "pypdfium2==4.30.1",
    "fpdf2==2.8.2",
    # --- ここから下は「同梱するだけ」の道具箱 -------------------------------
    # **fork 本体は import しない**。配備層の tool / function が import して使うために
    # 置いてある(上の pypdfium2 と同じ位置づけ)。したがって nucllei/ を grep しても
    # 参照が見つからないのが正常で、**「使われていない」を理由に消してはいけない**
    # — 消すと配備先で書かれた tool が動かなくなる。
    # pypandoc は Dockerfile が apt で pandoc バイナリを入れているのと対になっている。
    "python-pptx==1.0.0",
    "Markdown==3.7",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "pyxlsb==1.0.10",
    "pypandoc==1.15",
    "psutil",
    "sentencepiece",
    "soundfile==0.13.1",
    "azure-ai-documentintelligence==1.0.0",

    "pillow==12.3.0",
    "opencv-python-headless==4.11.0.86",

    "onnxruntime==1.20.1",

    "PyJWT[crypto]==2.13.0",
    "authlib==1.6.12",

    # extract_msg は GPL 依存連鎖(extract-msg→RTFDE→oletools→pcodedmp[GPLv3])のため除外。
    # 用途は .msg(Outlook)アップロードのみ(_memos/license-audit.md、issue #2)
    "pydub",

    "google-api-python-client",
    "google-auth-httplib2",

    "googleapis-common-protos==1.63.2",
    "google-cloud-storage==2.19.0",

    "azure-identity==1.20.0",
    "azure-storage-blob==12.24.1",

    "ldap3==2.9.1",

]
readme = "README.md"
requires-python = ">=3.11,<3.13"
# 配布用メタデータではない(Docker のみで出荷・wheel/PyPI 配布はしない — #34)。
# バージョンの真実源は git tag(APP_VERSION、#25)。ここは uv が要求するので置くだけ。
version = "0.0.0"

# CLI の正式な入口(typer app)。editable install されるので venv からそのまま叩ける:
#   uv run nucllei --help
#   uv run nucllei serve --port 8080
#   uv run nucllei create-admin --email a@llens.local --name A --password llens-dev
# Docker の CMD も同じ入口(`nucllei serve`)。
[project.scripts]
nucllei = "nucllei:app"

[project.optional-dependencies]
# 内蔵 STT(faster-whisper)。torch を引かないので軽く、Docker イメージに同梱する
# (#53: prod は内蔵 faster-whisper STT)。
stt = [
    "faster-whisper==1.1.1",
]
# On-device ML stack (pulls in torch, ~GBs). Only needed for LOCAL inference:
# the transformers audio pipeline, local Whisper STT, and OCR. Not required to
# boot the app or to use external providers (external STT). Install with:
#   uv sync --extra local-ml
# llens(#52): RAG embeddings / reranking (sentence-transformers / colbert-ai /
# einops) removed with the RAG/knowledge stack — no longer part of this fork.
local-ml = [
    "transformers",
    "accelerate",
    "faster-whisper==1.1.1",
    "rapidocr-onnxruntime==1.3.24",
]

[dependency-groups]
dev = [
    "playwright==1.49.1",
    "ruff==0.14.4",
    "docker~=7.1.0",
    "pytest~=8.3.2",
    "pytest-docker~=3.1.1",
    "moto[s3]>=5.0.26",
    "gcp-storage-emulator>=2024.8.3",
    "taskipy>=1.14.1",
]

[tool.ruff]
# llens(#25): lint は「正しさ系のみ・green 維持」。整形は black が担う。
# マイグレーション(alembic)は自動生成主体 — lint しない。
extend-exclude = [
    "nucllei/migrations",
]
# pre-push hook のようにファイルを明示指定で渡す呼び出しでも exclude を尊重する
# (既定ではディレクトリ走査時しか効かず、#34 の全ファイルリネームで hook が migration に噛んだ)
force-exclude = true

[tool.ruff.lint]
# E9 = 構文/実行時エラー級、F = pyflakes(未定義名・未使用 import 等)
select = ["E9", "F"]

# uv が nucllei 自身を editable install するのに必要(console script `nucllei` の生成元)。
# wheel/PyPI 配布はしない(Docker のみ — #34)— これはローカル venv 用の最小構成。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# テストは `from test.util ...` / `from nucllei ...` の両方を import するため、
# リポジトリルート(nucllei パッケージ)と nucllei/(test パッケージ)を
# sys.path に載せる。リポジトリルートから `uv run pytest` で実行する。
testpaths = ["nucllei/test"]
pythonpath = [".", "nucllei"]

[tool.uv]
# setuptools 81 で pkg_resources が削除され、これを import する依存 (fs 等) が壊れる
# (実測: test_provider.py の収集が ModuleNotFoundError で落ちた)。
# CVE-2025-47273 (setuptools の Path Traversal) の修正は 78.1.1 なので、
# **直った版のうち pkg_resources が残っている系列**に収める。
# setuptools は ctranslate2 / fs / torch が要求する = 配布 image にも載る。
constraint-dependencies = ["setuptools>=78.1.1,<81"]

[tool.taskipy.tasks]
# Backend dev server (hot reload) on :3000 — matches the docker single-origin
# layout (the frontend is served same-origin and Vite proxies /api etc. here;
# see vite.config.ts). `nucllei` はリポジトリルート直下なので cwd から import できる。
# `--forwarded-allow-ips '*'` trusts the local Vite proxy for X-Forwarded-*.
# `--reload-exclude _links/*`: マシン固有 symlink(現行 llens 参照)の編集で reload が
# 発火して in-flight リクエスト待ちのまま固まる事故を防ぐ(2026-07-18 実害 2 回)。
dev = "uvicorn nucllei.main:app --host 0.0.0.0 --port 3000 --reload --reload-exclude '_links/*' --forwarded-allow-ips '*'"
# backend の CI ゲート相当(pnpm 側の lint:backend / format:backend と同じ実体。
# format は書き換え、check は pre-push hook / CI と同じ「未整形 + lint を検査のみ」)
format = "black ."
lint = "ruff check nucllei"
test = "pytest"
check = "black --check . && ruff check nucllei"
# 配布ホスト (depot) の CVE スキャン結果を手元から見る (#24)。**読み取りのみ**。
# 手元にスキャナを持たないのは、関所 (promoter) / 網 (make scan) に続く 3 つ目の判定を
# 作らないため — ずれると「手元では出ないのに配布側で止まる」が起きる。
# 院内ネットの llens-depot に届く環境でだけ動く (CI では走らせない)。詳細は scripts/check_cve.py
cve = "python scripts/check_cve.py"
# 依存ライセンス一覧の再生成。**配布物のこれは image ビルド時に作られる** (Dockerfile) ので
# コミットは不要 — このタスクは手元の dev サーバで License タブを見たいときだけ使う
licenses = "python scripts/generate_licenses.py"
# deploy の入口(technoplasm-app `make tag` の移植): ガード → 採番 → tag → push(既定)
# → CI が ghcr.io/technoplasm/nucllei:<tag> を出す。`uv run task tag pre` / `tag release`。
tag = "python scripts/tag.py"

# CLI 本体は console script(`uv run nucllei --help`、[project.scripts])。ここに置くのは
# repo 雑務タスクだけ。以下は慣例 dev admin(ken@llens.local / llens-dev)を一発で作る
# dev 専用エイリアス — 一般の admin 作成は `uv run nucllei create-admin --email ...`。
create-dev-admin = "nucllei create-admin --email ken@llens.local --name Ken --password llens-dev"

# ----- sandbox (sandbox/ = ghcr.io/technoplasm/nucllei-sandbox。設計は sandbox/README.md) -----
# `[tool.pytest.ini_options]` の testpaths は `nucllei/test` だけなので、sandbox/tests は
# 素の `uv run pytest` には入らない。**明示指定するこの 2 タスクからだけ走る** —
# コンテナ依存の統合テストで backend のゲートを汚さないための切り分け。
#
# 統合テスト: 稼働中の privileged コンテナに対し、jail の *中から* 権限昇格・デバイス可視性・
# 無ネットワークを突く。コンテナが無ければ全 skip。名前は SANDBOX_CONTAINER で差し替え
# (既定は現行配備の llens-sandbox)。pytest 不要のランナーを持つので直接叩く。
sandbox-test = "python3 sandbox/tests/test_isolation.py"
# ユニットテスト: main.py を直接 import して SessionManager 等を確認。コンテナ不要。
# main.py の import に要る fastapi/pydantic は本体の依存に既にあるので `--with` は不要。
sandbox-unit = "pytest -p no:warnings sandbox/tests/test_session_manager.py"

